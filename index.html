<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de Caligramas</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:40px;text-align:center}
.card{max-width:800px;margin:auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
input{width:80%;padding:12px;font-size:18px}
button{padding:12px 20px;font-size:18px;margin-top:15px;cursor:pointer}
pre{white-space:pre-wrap;font-family:monospace;font-size:18px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>Generador de Caligramas</h1>
<p>Escribe una palabra y presiona el botón.</p>
<input id="txt" placeholder="Ejemplo: Árbol">
<br>
<button onclick="g()">Generar caligrama</button>
<pre id="out"></pre>
</div>
<script>
function g(){
 let w=document.getElementById('txt').value.trim();
 if(!w){document.getElementById('out').textContent="Escribe una palabra.";return;}
 let s="";
 for(let i=0;i<w.length;i++){
   s+=" ".repeat(i)+w[i].toUpperCase()+"\n";
 }
 s+="\n"+w.toUpperCase()+"\n";
 for(let i=w.length-1;i>=0;i--){
   s+=" ".repeat(i)+w[i].toUpperCase()+"\n";
 }
 document.getElementById('out').textContent=s;
}
</script>
</body>
</html>
